<script>
// Jalali (Persian) <-> Gregorian calendar conversion.
// Algorithm by K. M. Borkowski, same core used by the jalaali-js library — embedded
// here so this page works fully on its own, with no external script dependency.
(function(){
  var breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  function div(a,b){return ~~(a/b);}
  function mod(a,b){return a-~~(a/b)*b;}
  function jalCal(jy, withoutLeap){
    var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump,leap,leapG,march,n,i;
    if(jy<jp||jy>=breaks[bl-1]) throw new Error('Invalid Jalaali year '+jy);
    for(i=1;i<bl;i+=1){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4); jp=jm; }
    n=jy-jp;
    leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
    if(mod(jump,33)===4 && jump-n===4) leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
    march=20+leapJ-leapG;
    if(withoutLeap) return {gy:gy, march:march};
    if(jump-n<6) n=n-jump+div(jump+4,33)*33;
    leap=mod(mod(n+1,33)-1,4);
    if(leap===-1) leap=4;
    return {leap:leap, gy:gy, march:march};
  }
  function g2d(gy,gm,gd){
    var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
    d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
    return d;
  }
  function d2g(jdn){
    var j,i,gd,gm,gy;
    j=4*jdn+139361631;
    j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
    i=div(mod(j,1461),4)*5+308;
    gd=div(mod(i,153),5)+1;
    gm=mod(div(i,153),12)+1;
    gy=div(j,1461)-100100+div(8-gm,6);
    return {gy:gy,gm:gm,gd:gd};
  }
  function j2d(jy,jm,jd){
    var r=jalCal(jy,true);
    return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
  }
  function d2j(jdn){
    var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy,false), jdn1f=g2d(gy,3,r.march), jd,jm,k;
    k=jdn-jdn1f;
    if(k>=0){
      if(k<=185){ jm=1+div(k,31); jd=mod(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
      else { k-=186; }
    } else { jy-=1; k+=179; if(r.leap===1) k+=1; }
    jm=7+div(k,30); jd=mod(k,30)+1;
    return {jy:jy,jm:jm,jd:jd};
  }
  function toJalaali(gy,gm,gd){
    if(Object.prototype.toString.call(gy)==='[object Date]'){ gd=gy.getDate(); gm=gy.getMonth()+1; gy=gy.getFullYear(); }
    return d2j(g2d(gy,gm,gd));
  }
  function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
  function isLeapJalaaliYear(jy){ return jalCal(jy).leap===0; }
  function jalaaliMonthLength(jy,jm){
    if(jm<=6) return 31;
    if(jm<=11) return 30;
    return isLeapJalaaliYear(jy) ? 30 : 29;
  }
  function isValidJalaaliDate(jy,jm,jd){
    return jy>=-61 && jy<=3177 && jm>=1 && jm<=12 && jd>=1 && jd<=jalaaliMonthLength(jy,jm);
  }
  window.jalaali = { toJalaali:toJalaali, toGregorian:toGregorian, isValidJalaaliDate:isValidJalaaliDate,
    isLeapJalaaliYear:isLeapJalaaliYear, jalaaliMonthLength:jalaaliMonthLength, jalCal:jalCal, j2d:j2d, d2j:d2j, g2d:g2d, d2g:d2g };
})();

  .case-card .cmeta{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

  .badge{ font-size:0.6875rem; font-weight:700; padding:3px 9px; border-radius:20px; border:1px solid; display:inline-block; }
  .badge-brass{ color:var(--brass); border-color:color-mix(in srgb, var(--brass) 40%, transparent); background:color-mix(in srgb, var(--brass) 10%, transparent); }
  .badge-sage{ color:var(--sage); border-color:color-mix(in srgb, var(--sage) 40%, transparent); background:color-mix(in srgb, var(--sage) 10%, transparent); }
  .badge-maroon{ color:var(--alarm); border-color:color-mix(in srgb, var(--maroon) 40%, transparent); background:color-mix(in srgb, var(--maroon) 10%, transparent); }
  .badge-slate{ color:var(--slate); border-color:color-mix(in srgb, var(--slate) 40%, transparent); background:color-mix(in srgb, var(--slate) 10%, transparent); }
  .badge-amber{ color:var(--amber); border-color:color-mix(in srgb, var(--amber) 40%, transparent); background:color-mix(in srgb, var(--amber) 12%, transparent); }
  .badge-violet{ color:var(--violet); border-color:color-mix(in srgb, var(--violet) 45%, transparent); background:color-mix(in srgb, var(--violet) 12%, transparent); }
  .badge-teal{ color:var(--teal); border-color:color-mix(in srgb, var(--teal) 45%, transparent); background:color-mix(in srgb, var(--teal) 12%, transparent); }

  .detail-panel{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .mobile-only{ display:inline-block; }
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:16px; }

  .detail-head .court-line{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px 20px; margin-top:14px; font-size:0.8125rem; }
  .info-grid .lbl{ color:var(--text-muted); font-size:0.6875rem; }

  .detail-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .next-action{ background:var(--panel-alt); border:1px solid var(--border); border-inline-start:3px solid var(--brass); border-radius:10px; padding:12px 14px; margin-bottom:18px; }
  .next-action .lbl{ font-size:0.6875rem; color:var(--text-muted); margin-bottom:4px; }
  .next-action .txt{ font-size:0.8125rem; white-space:pre-wrap; }

  .attach-list{ display:flex; flex-direction:column; gap:8px; }
  .attach-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
  .attach-info{ min-width:0; }
  .attach-title{ font-size:0.8125rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach-meta{ font-size:0.6875rem; color:var(--text-muted); margin-top:2px; }
  .attach-actions{ display:flex; gap:6px; flex-shrink:0; }

  .followup-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;
    border-inline-end:3px solid var(--slate); }
  .followup-row.pri-urgent{ border-inline-end-color:var(--maroon); }
  .followup-row.is-done{ opacity:.55; }
  .fu-main{ min-width:0; flex:1 1 220px; }
  .fu-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .fu-case{ font-size:0.6875rem; color:var(--text-muted); }
  .fu-title{ font-size:0.8125rem; font-weight:700; }
  .fu-desc{ font-size:0.75rem; color:var(--text-muted); margin-top:3px; white-space:pre-wrap; }
  .fu-actions{ display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; }

  .timeline{ position:relative; margin-top:6px; }
  .tl-item{ position:relative; padding-inline-end:26px; padding-bottom:20px; border-inline-end:2px solid var(--border); margin-inline-end:9px; }
  .tl-item:last-child{ border-color:transparent; padding-bottom:0; }
  .tl-dot{ position:absolute; inline-size:calc(1rem * var(--icon-scale,1)); block-size:calc(1rem * var(--icon-scale,1)); border-radius:50%; inset-inline-end:calc(-0.56rem * var(--icon-scale,1)); top:0; border:2px solid var(--ink); }
  .tl-dot.brass{background:var(--brass);} .tl-dot.sage{background:var(--sage);} .tl-dot.maroon{background:var(--maroon);}
  .tl-dot.slate{background:var(--slate);} .tl-dot.amber{background:var(--amber);} .tl-dot.violet{background:var(--violet);}
  .tl-dot.teal{background:var(--teal);} .tl-dot.muted{background:var(--text-muted);}
  .tl-card{ background:var(--panel-alt); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .tl-card.is-done{ opacity:.6; }
  .tl-card.is-overdue{ border-color:color-mix(in srgb, var(--maroon) 50%, transparent); }
  .tl-card .tl-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .tl-card .tl-date{ font-weight:700; font-size:0.8125rem; color:var(--brass); }
  .tl-card .tl-title{ font-weight:700; font-size:0.875rem; margin-top:6px; }
  .tl-card .tl-desc{ font-size:0.8125rem; color:var(--text-muted); margin-top:4px; white-space:pre-wrap; }
  .tl-card .tl-actions{ margin-top:8px; display:flex; gap:4px; flex-wrap:wrap; }

  /* ---------- forms ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.75rem; color:var(--text-muted); margin-bottom:6px; }
  .field .err{ font-size:0.75rem; color:var(--alarm); margin-top:5px; }
  .field .hint{ font-size:0.6875rem; color:var(--text-muted); margin-top:5px; line-height:1.6; }
  input[type=text], input[type=number], select, textarea{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:0.875rem; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }

  .calc-box{ background:var(--panel-alt); border:1px dashed var(--border); border-radius:10px; padding:12px; margin-bottom:14px; }
  .calc-box .calc-title{ font-size:0.75rem; color:var(--brass); font-weight:700; margin-bottom:8px; }
  .preset-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .preset{ font-size:0.6875rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer;
    background:var(--panel); border:1px solid var(--border); color:var(--text-muted); font-family:inherit; }
  .preset:hover{ border-color:var(--brass-dim); color:var(--text); }

  .modal-backdrop{ position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-start; justify-content:center; padding:4vh 16px; z-index:100; overflow-y:auto; }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px; width:100%; max-width:560px; margin-bottom:5vh; }
  .modal h3{ margin:0 0 16px; color:var(--brass); font-size:1.0625rem; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; }
  .confirm-text{ font-size:0.875rem; margin-bottom:18px; line-height:1.8; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-alt); border:1px solid var(--brass-dim); color:var(--text); padding:10px 18px; border-radius:10px; font-size:0.8125rem; z-index:200; max-width:90vw; text-align:center; }
  .loading{ text-align:center; padding:60px 0; color:var(--text-muted); font-size:0.875rem; }

  .storage-warn{
    margin-top:16px; background:color-mix(in srgb, var(--maroon) 10%, transparent); border:1px solid color-mix(in srgb, var(--maroon) 45%, transparent);
    border-radius:14px; padding:14px 16px;
  }
  .storage-warn .sw-title{ font-weight:800; font-size:0.875rem; color:var(--alarm); margin-bottom:6px; }
  .storage-warn .sw-body{ font-size:0.8125rem; color:var(--text); line-height:1.9; }

  .setup-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:6vh 16px; }
  .setup-card{ background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:28px 24px; width:100%; max-width:640px; }
  .setup-logo{ font-weight:800; font-size:1.375rem; color:var(--brass); margin-bottom:8px; }
  .setup-lead{ font-size:0.8125rem; color:var(--text-muted); line-height:1.9; margin-bottom:4px; }
  .setup-card .storage-warn{ margin-top:14px; }


  /* ---------- appearance ---------- */
  .appear-scrim{ position:fixed; inset:0; z-index:45; background:transparent; }
  .appear-panel{
    position:fixed; top:70px; inset-inline-end:16px; z-index:50;
    width:min(440px, calc(100vw - 24px));
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:18px; box-shadow:0 18px 50px color-mix(in srgb, var(--ink) 55%, transparent);
    max-height:calc(100vh - 90px); overflow:auto;
  }
  .appear-panel h3{ margin:0 0 4px; color:var(--brass); font-size:1rem; }
  .appear-lead{ font-size:0.75rem; color:var(--text-muted); margin-bottom:14px; line-height:1.7; }
  .appear-label{ font-size:0.75rem; font-weight:700; color:var(--text-muted); margin:12px 0 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .scale-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .scale-chip{
    flex:1 1 0; min-width:64px; border:1px solid var(--border); background:var(--panel-alt);
    color:var(--text); border-radius:10px; padding:8px 6px; cursor:pointer; font-family:inherit;
    font-size:0.75rem; font-weight:700; text-align:center;
  }
  .scale-chip.active{ background:var(--brass); border-color:var(--brass); color:var(--on-accent); }
  .scale-chip:hover:not(.active){ border-color:var(--brass-dim); }
  .pal-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .pal-card{
    display:flex; flex-direction:column; gap:8px; text-align:right; font-family:inherit;
    border:1px solid var(--border); background:var(--panel-alt); border-radius:12px;
    padding:10px 12px; cursor:pointer; color:var(--text);
  }
  .pal-card.active{ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); }
  .pal-card:hover{ border-color:var(--brass-dim); }
  .pal-dots{ display:flex; gap:5px; }
  .pal-dot{ width:16px; height:16px; border-radius:50%; border:1px solid var(--border); }
  .pal-name{ font-size:0.8125rem; font-weight:700; }
  .settings-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:16px 18px; margin-bottom:20px; display:flex; flex-direction:column; gap:10px;
  }
  .settings-lead{ font-size:0.8125rem; color:var(--text-muted); line-height:1.8; }
  a.btn{ text-decoration:none; }
  .setup-tools{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  .setup-card .appear-bar{
    max-width:none; margin:0 0 16px; padding:0 0 12px;
    border-top:none; border-bottom:1px solid var(--border);
  }
  .setup-card .appear-pals{ margin-inline-start:0; }

  .appear-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
    max-width:1180px; margin:0 auto; padding:8px 16px 10px;
    border-top:1px solid var(--border);
  }
  .appear-ctrl{
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:4px 8px;
  }
  .appear-ctrl-lbl{
    font-size:0.6875rem; font-weight:700; color:var(--text-muted); padding-inline:4px; white-space:nowrap;
  }
  .appear-pct{ font-size:0.6875rem; font-weight:800; color:var(--brass); min-width:2.6em; text-align:center; }
  .appear-ctrl input[type=range]{
    width:88px; height:22px; accent-color:var(--brass); cursor:pointer; direction:ltr;
    padding:0; background:transparent; border:none;
  }
  .stepper{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-alt); color:var(--text); cursor:pointer; font-family:inherit;
    font-weight:800; font-size:0.875rem; display:inline-flex; align-items:center; justify-content:center;
    padding:0;
  }
  .stepper:hover{ border-color:var(--brass-dim); color:var(--brass); }
  .stepper .ico{ margin:0; width:14px; height:14px; }
  .appear-pals{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-inline-start:auto; }
  .pal-swatch{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--border); cursor:pointer; padding:0;
    background:linear-gradient(135deg, var(--sw1) 0 50%, var(--sw2) 50% 100%);
  }
  .pal-swatch.active{ border-color:var(--brass); box-shadow:0 0 0 2px color-mix(in srgb, var(--brass) 45%, transparent); }
  .scale-slide{ width:100%; accent-color:var(--brass); direction:ltr; cursor:pointer; }
  input[type=range].scale-slide{
    background:transparent; border:none; padding:0; height:28px;
  }

  @media print{
    .appear-scrim, .appear-panel, [data-act="toggle-appearance"], .appear-bar{ display:none !important; }
  }

  /* ---------- print ---------- */
  .print-only{ display:none; }
  @media print{
    body{ background:#fff; color:#000; }
    header.top, .filter-bar, .detail-actions, .tl-actions, .attach-actions, .fu-actions, .case-list, .no-print{ display:none !important; }
    .app{ max-width:none; padding:0; }
    .detail-panel{ border:none; background:#fff; padding:0; }
    .cases-layout{ display:block !important; }
    .tl-card, .next-action, .stat-card{ background:#fff; border:1px solid #999; }
    .cnum-big, .section-title, .tl-date, .case-card .cnum{ color:#000 !important; }
    .info-grid .lbl, .tl-desc, .next-action .lbl{ color:#444 !important; }
    .badge{ color:#000 !important; border-color:#666 !important; background:#fff !important; }
    .tl-item{ border-inline-end:1px solid #bbb; }
    .print-only{ display:block; margin-bottom:14px; font-size:0.75rem; color:#444; border-bottom:1px solid #999; padding-bottom:8px; }
    .fin-actions{ display:none !important; }
    .fin-row{ background:#fff; border:1px solid #999; }
    .fin-amount, .fin-sum .stat-card .num{ color:#000 !important; }
  }

  /* ---------- امور مالی و پرداختی‌ها ---------- */
  .fin-sum{ display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:10px; margin-bottom:12px; }
  .fin-sum .stat-card{ padding:11px 13px; }
  .stat-card .num.money{ font-size:1.1rem; line-height:1.9; word-break:break-all; }
  .stat-card .num.pos{ color:var(--sage); }
  .stat-card .num.neg{ color:var(--alarm); }
  .fin-list{ display:flex; flex-direction:column; gap:8px; }
  .fin-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;
    background:var(--panel-alt); border:1px solid var(--border); border-radius:12px; padding:10px 13px; }
  .fin-row.k-income{ border-inline-start:3px solid color-mix(in srgb, var(--sage) 65%, transparent); }
  .fin-row.k-expense{ border-inline-start:3px solid color-mix(in srgb, var(--maroon) 55%, transparent); }
  .fin-main{ min-width:0; flex:1 1 260px; }
  .fin-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .fin-amount{ font-weight:800; font-size:.95rem; white-space:nowrap; }
  .fin-row.k-income .fin-amount{ color:var(--sage); }
  .fin-row.k-expense .fin-amount{ color:var(--alarm); }
  .fin-date{ font-size:.72rem; color:var(--text-muted); }
  .fin-meta{ font-size:.72rem; color:var(--text-muted); margin-top:5px; display:flex; gap:4px 16px; flex-wrap:wrap; }
  .fin-meta b{ color:var(--text); font-weight:600; }
  .fin-desc{ font-size:.78rem; color:var(--text); margin-top:5px; white-space:pre-wrap; }
  .fin-actions{ display:flex; gap:6px; align-items:center; }
  .fin-legend{ display:flex; gap:16px; font-size:.7rem; color:var(--text-muted); margin:8px 0 2px; }
  .fin-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:5px; vertical-align:-1px; }
  .fin-legend i.inc{ background:var(--sage); }
  .fin-legend i.exp{ background:var(--maroon); }
  .fin-pair{ gap:3px; }
  .fin-pair .trend-bar{ width:min(14px,42%); }
  .trend-bar.inc{ background:linear-gradient(180deg,var(--sage),color-mix(in srgb,var(--sage) 55%, var(--panel))); border:1px solid color-mix(in srgb,var(--sage) 55%, transparent); }
  .trend-bar.exp{ background:linear-gradient(180deg,var(--maroon),color-mix(in srgb,var(--maroon) 55%, var(--panel))); border:1px solid color-mix(in srgb,var(--maroon) 55%, transparent); }

  /* ---------- لمس و ریزتعامل‌ها ---------- */
  body{ -webkit-text-size-adjust:100%; touch-action:manipulation; }
  button, .btn, .tab, .case-card, .hearing-item, .preset, .pal-swatch, .scale-chip{ -webkit-tap-highlight-color:transparent; }
  .btn:active, .tab:active, .period-btn:active, .preset:active{ transform:scale(.98); }
  header.top{ padding-top:calc(12px + env(safe-area-inset-top,0px)); }

  /* ---------- رنگ‌بندی متنوع کارت‌ها و تب‌ها ---------- */
  .stat-card{ border-inline-start:4px solid transparent; }
  .stat-card.acc-brass{ border-inline-start-color:var(--brass); background:linear-gradient(135deg, color-mix(in srgb, var(--brass) 7%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-sage{ border-inline-start-color:var(--sage); background:linear-gradient(135deg, color-mix(in srgb, var(--sage) 8%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-maroon{ border-inline-start-color:var(--maroon); background:linear-gradient(135deg, color-mix(in srgb, var(--maroon) 8%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-slate{ border-inline-start-color:var(--slate); background:linear-gradient(135deg, color-mix(in srgb, var(--slate) 9%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-amber{ border-inline-start-color:var(--amber); background:linear-gradient(135deg, color-mix(in srgb, var(--amber) 8%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-violet{ border-inline-start-color:var(--violet); background:linear-gradient(135deg, color-mix(in srgb, var(--violet) 9%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-teal{ border-inline-start-color:var(--teal); background:linear-gradient(135deg, color-mix(in srgb, var(--teal) 9%, var(--panel)), var(--panel) 55%); }
  .stat-card.acc-brass .num{ color:var(--brass); }
  .stat-card.acc-sage .num{ color:var(--sage); }
  .stat-card.acc-maroon .num{ color:var(--alarm); }
  .stat-card.acc-slate .num{ color:var(--slate); }
  .stat-card.acc-amber .num{ color:var(--amber); }
  .stat-card.acc-violet .num{ color:var(--violet); }
  .stat-card.acc-teal .num{ color:var(--teal); }
  .stat-card.alarm{ border-inline-start-color:var(--maroon); }
  .tab[data-view="stats"]:not(.active) .ico{ color:var(--violet); }
  .tab[data-view="cases"]:not(.active) .ico{ color:var(--teal); }
  .tab[data-view="followups"]:not(.active) .ico{ color:var(--amber); }
  .tab[data-view="settings"]:not(.active) .ico{ color:var(--slate); }
  .tab[data-view="dashboard"]:not(.active) .ico{ color:var(--brass); }
  .tab.alarm:not(.active) .ico{ color:var(--alarm); }

  /* ---------- دکمه راهنما (؟) و حباب توضیح ---------- */
  .help-btn{
    inline-size:1.1rem; block-size:1.1rem; border-radius:50%; border:1px solid var(--border);
    background:var(--panel-alt); color:var(--text-muted); font-size:.68rem; font-weight:800; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
    vertical-align:-0.14em; margin-inline-start:5px; font-family:inherit; flex:0 0 auto;
  }
  .help-btn:hover{ color:var(--brass); border-color:var(--brass-dim); }
  .help-pop{
    position:fixed; z-index:300; background:var(--panel-alt); border:1px solid var(--brass-dim);
    border-radius:12px; padding:12px 14px; width:min(320px, calc(100vw - 24px));
    box-shadow:0 14px 40px color-mix(in srgb, var(--ink) 60%, transparent);

    state.cases.forEach(function(c){ var t=Date.parse(c.createdAt||""); if(t && (!oldest||t<oldest)) oldest=t; });

    "attach-modal":{t:"ذخیرهٔ پیوست", b:"فایل روی همین دستگاه (حافظهٔ مرورگر) ذخیره می‌شود و همراه «پشتیبان کامل» منتقل می‌گردد. ذخیرهٔ فایل‌های خیلی حجیم ممکن است کند باشد."},

    "overdue-dash":{t:"سررسیدهای گذشته", b:"پس از انجام یا منتفی‌شدن هر مورد، در صفحهٔ پرونده آن را «انجام شد» علامت بزنید تا از این فهرست خارج شود."},
    "profile-title":{t:"عنوان سربرگ", b:"همین عنوان در بالای صفحه و در برگهٔ چاپی پرونده نمایش داده می‌شود."},
    "profile-role":{t:"سمت حرفه‌ای", b:"فقط در برگهٔ چاپی، زیر نام درج می‌شود."},
    "court-type":{t:"مرجع رسیدگی", b:"رنگ نوار کنارهٔ پرونده و برچسب‌ها بر اساس همین مرجع تعیین می‌شود؛ عنوان طرفین نیز متناسب با آن تغییر می‌کند."},
    "outcome-date":{t:"تاریخ نتیجه", b:"اگر برد/باخت را انتخاب کنید و تاریخ خالی باشد، تاریخ امروز ثبت می‌شود."},
    "next-action":{t:"وضعیت فعلی", b:"این یادداشت در بالای صفحهٔ پرونده نمایش داده می‌شود."},
    "date-2digit":{t:"تاریخ شمسی", b:"سال ۲رقمی نسبت به امروز تفسیر می‌شود؛ مثلاً ۸۵ می‌شود ۱۳۸۵ و ۰۵ می‌شود ۱۴۰۵."},
    "deadline-calc":{t:"محاسبهٔ سررسید", b:"این محاسبه صرفاً تقویمی است و اعداد پیش‌فرض فقط برای تسریع کار است؛ مبدأ مهلت، ایام تعطیل، اقامت خارج از کشور و مقررات خاص حاکم بر همان پرونده را جداگانه بررسی کنید."}
  };
  function helpBtn(key){
    return '<button type="button" class="help-btn no-print" data-act="help" data-help="'+key+'" aria-label="راهنما">؟</button>';
  }
  var helpPopEl=null, helpKeyOpen=null;
  function closeHelp(){
    if(helpPopEl && helpPopEl.parentNode) helpPopEl.parentNode.removeChild(helpPopEl);
    helpPopEl=null; helpKeyOpen=null;
  }
  function toggleHelp(anchor, key){
    if(helpPopEl && helpKeyOpen===key){ closeHelp(); return; }
    closeHelp();
    var h=HELP[key]; if(!h) return;
    var d=document.createElement("div");
    d.className="help-pop"; d.setAttribute("role","note"); d.setAttribute("dir","rtl");
    d.innerHTML='<div class="hp-t"><span>'+h.t+'</span><button type="button" class="hp-x" aria-label="بستن">✕</button></div><div class="hp-b">'+h.b+'</div>';
    document.body.appendChild(d);
    helpPopEl=d; helpKeyOpen=key;
    try{
      var r=anchor.getBoundingClientRect();
      var vw=window.innerWidth||360, vh=window.innerHeight||640;
      var w=Math.min(320, vw-24);
      var left=Math.max(12, Math.min(r.left + r.width/2 - w/2, vw-w-12));
      var top=r.bottom+8;
      d.style.left=left+"px"; d.style.top=top+"px";
      var hgt=d.offsetHeight||0;
      if(top+hgt>vh-10){
        var t2=r.top-hgt-8;

      }
    }catch(e){ d.style.left="12px"; d.style.top="80px"; }
    d.querySelector(".hp-x").addEventListener("click",function(ev){ ev.stopPropagation(); closeHelp(); });
    d.addEventListener("click",function(ev){ ev.stopPropagation(); });
  }
  document.addEventListener("pointerdown",function(ev){
    if(!helpPopEl) return;
    if(helpPopEl.contains(ev.target)) return;

    closeHelp();
  },true);
  window.addEventListener("scroll",function(){ closeHelp(); },true);
  window.addEventListener("resize",function(){ closeHelp(); });
  var FONT_STEPS = [
    {v:0.85,label:"کوچک"},{v:1,label:"متوسط"},{v:1.12,label:"بزرگ"},{v:1.28,label:"خیلی بزرگ"}

  var ICON_STEPS = [
    {v:0.85,label:"کوچک"},{v:1,label:"متوسط"},{v:1.2,label:"بزرگ"},{v:1.45,label:"خیلی بزرگ"}
  ];
  var FONT_MIN=0.8, FONT_MAX=1.45, ICON_MIN=0.75, ICON_MAX=1.6;
  var PALETTES = [
    {id:"brass",label:"برنز شب",dots:["#14171d","#cfa64d","#ece6d6"]},
    {id:"pearl",label:"صدف روز",dots:["#f3eee4","#9a6b24","#2a2418"]},
    {id:"navy",label:"نیلی طلایی",dots:["#0c1422","#d4b46a","#e7eef6"]},
    {id:"olive",label:"زیتونی",dots:["#131610","#c6b07a","#e7eadc"]},
    {id:"wine",label:"یاقوتی",dots:["#180e12","#d4b07a","#f3e6e8"]},
    {id:"sea",label:"دریایی",dots:["#0c1416","#7ec8bc","#e4eef0"]},
    {id:"slate",label:"ذغالی",dots:["#101318","#8aa4c4","#e6eaf0"]},
    {id:"sand",label:"ماسه روشن",dots:["#f6eedc","#8a5a28","#2c2418"]}
  ];
  function defaultAppearance(){ return {palette:"brass", fontScale:1, iconScale:1}; }
  function loadAppearance(){
    var a=defaultAppearance();
    try{
      var raw=window.localStorage.getItem(APPEAR_KEY);
      if(raw){
        var p=JSON.parse(raw);
        if(p && typeof p==="object"){
          if(typeof p.palette==="string") a.palette=p.palette;
          if(typeof p.fontScale==="number") a.fontScale=p.fontScale;
          if(typeof p.iconScale==="number") a.iconScale=p.iconScale;
        }
      }
    }catch(e){}
    var known=false;
    for(var i=0;i<PALETTES.length;i++) if(PALETTES[i].id===a.palette) known=true;
    if(!known) a.palette="brass";
    return a;
  }
  function applyAppearance(){
    var a=state.appearance||defaultAppearance();
    document.documentElement.setAttribute("data-palette", a.palette);
    document.documentElement.style.setProperty("--ui-scale", String(a.fontScale));
    document.documentElement.style.setProperty("--icon-scale", String(a.iconScale));
    try{
      var ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
      var mt=document.getElementById("metaTheme");
      if(ink && mt) mt.setAttribute("content", ink);
    }catch(e){}
  }
  function saveAppearance(){
    try{ window.localStorage.setItem(APPEAR_KEY, JSON.stringify(state.appearance)); }catch(e){}
  }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function round2(n){ return Math.round(n*100)/100; }
  function liveAppearance(patch){
    state.appearance=Object.assign({}, state.appearance||defaultAppearance(), patch);
    saveAppearance();
    applyAppearance();
    var a=state.appearance;
    var f=document.getElementById("fontScaleVal");
    var i=document.getElementById("iconScaleVal");
    var f2=document.getElementById("fontScaleVal2");
    var i2=document.getElementById("iconScaleVal2");

    var k=toFaDigits(Math.round(a.iconScale*100))+"٪";
    if(f) f.textContent=t; if(f2) f2.textContent=t;
    if(i) i.textContent=k; if(i2) i2.textContent=k;
  }
  function bumpAppearance(key, dir){
    var min=key==="fontScale"?FONT_MIN:ICON_MIN;
    var max=key==="fontScale"?FONT_MAX:ICON_MAX;
    var next=clamp(round2((state.appearance[key]||1)+dir*0.07), min, max);
    var patch={}; patch[key]=next;

    var acts=key==="fontScale"?["font-range","font-range-panel"]:["icon-range","icon-range-panel"];

  function patchAppearance(patch){

  function stepActive(steps, val){
    var best=steps[0].v, bd=Math.abs(steps[0].v-val);

      if(d<bd){ bd=d; best=steps[i].v; }

      chart:'<path d="M4 19V11"/><path d="M10 19V5"/><path d="M16 19v-6"/><path d="M22 19H2"/>',

      user:'<circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.2-3.2 3.4-5 7-5s5.8 1.8 7 5"/>',
      download:'<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',
      upload:'<path d="M12 20V8"/><path d="M7 13l5-5 5 5"/><path d="M5 20h14"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',

      palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/>',
      type:'<path d="M4 19h6M7 19V6h8v13M11 6h8M15 6v4"/>',

  function formatBytes(n){
    if(n<1024) return toFaDigits(n)+" B";
    if(n<1024*1024) return toFaDigits((n/1024).toFixed(1))+" KB";
    return toFaDigits((n/1024/1024).toFixed(1))+" MB";
  }

  /* ---------------- attachments (IndexedDB) ----------------
     پیوست‌ها به‌صورت فایل باینری در IndexedDB همین مرورگر ذخیره می‌شوند —
     جدا از localStorage (که فقط داده‌های متنی پرونده را نگه می‌دارد).
     در «پشتیبان کامل» این پیوست‌ها به‌صورت dataURL داخل JSON گنجانده و
     هنگام بازیابی دوباره به فایل تبدیل می‌شوند. */
  var FILES_DB_NAME="case-tracker-files", FILES_DB_VERSION=1, FILES_STORE="attachments";
  var filesDbPromise=null;
  var attachmentsOK = !!(window.indexedDB);
  function openFilesDB(){
    if(filesDbPromise) return filesDbPromise;
    filesDbPromise=new Promise(function(resolve,reject){
      if(!window.indexedDB){ reject(new Error("no-indexeddb")); return; }
      var req;
      try{ req=window.indexedDB.open(FILES_DB_NAME, FILES_DB_VERSION); }
      catch(e){ reject(e); return; }
      req.onupgradeneeded=function(ev){
        var db=ev.target.result;
        if(!db.objectStoreNames.contains(FILES_STORE)){
          var store=db.createObjectStore(FILES_STORE,{keyPath:"id"});
          store.createIndex("caseId","caseId",{unique:false});
        }
      };

  function expandShortYear(jy){

  function numToWordsFa(n){
    n=Math.round(Math.abs(n||0));
    if(n===0) return "صفر";
    var ones=["","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه"];
    var teens=["ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"];
    var tens=["","","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"];
    var hundreds=["","صد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"];
    var scales=["","هزار","میلیون","میلیارد","هزار میلیارد"];
    function three(x){
      var p=[];
      if(x>=100){ p.push(hundreds[Math.floor(x/100)]); x=x%100; }
      if(x>=20){ var t=tens[Math.floor(x/10)], o=x%10; p.push(o?t+" و "+ones[o]:t); }
      else if(x>=10){ p.push(teens[x-10]); }
      else if(x>0){ p.push(ones[x]); }
      return p.join(" و ");
    }
    var parts=[], i=0;
    while(n>0 && i<scales.length){
      var chunk=n%1000;
      if(chunk) parts.unshift(three(chunk)+(scales[i]?" "+scales[i]:""));
      n=Math.floor(n/1000); i++;
    }
    return parts.join(" و ");
  }

  function collectStats(period){
    period=period||"month";

    var bm={}; r.buckets.forEach(function(x){bm[x.key]=x;});
    function hit(date,kind){
      if(!inStatsPeriod(date,period)) return;
      r[kind]++;
      var bi=statsBucketInfo(period,date); if(bi&&bm[bi.key]) bm[bi.key].value++;
    }
    state.cases.forEach(function(c){
      hit(c.openedDate||isoToJalaliStr(c.createdAt),"cases");
      (c.followups||[]).forEach(function(f){ hit(f.date||isoToJalaliStr(f.createdAt),"followups"); });
      (c.events||[]).forEach(function(e){ if(e.type==="motion") hit(e.date,"motions"); });

    });

  function collectFinStats(period){

    var bm={}; r.buckets.forEach(function(x){ bm[x.key]=x; });
    state.cases.forEach(function(c){
      (c.finance||[]).forEach(function(x){

        else { r.expense+=x.amount; if(x.payer==="lawyer") r.lawyerPaid+=x.amount; }

  function normalizeImportedData(parsed){

        defendant:safeString(src.defendant,2000), subject:safeString(src.subject,3000), nextAction:safeString(src.nextAction,20000),

        var eid=safeId(e.id)?e.id:uid(); if(seenEv[eid]) eid=uid(); seenEv[eid]=1;
        var date=migrateDateStr(e.date); if(!date) throw new Error("bad-event-date");
        return {id:eid,type:safeEnum(e.type,EVENT_TYPES,"other"),date:date,title:safeString(e.title,3000),description:safeString(e.description,20000),done:!!e.done,createdAt:safeString(e.createdAt,40)||new Date().toISOString(),updatedAt:safeString(e.updatedAt,40)||new Date().toISOString()};
      });
      var fus=Array.isArray(src.followups)?src.followups:[]; if(fus.length>20000) throw new Error("too-many-followups");
      var seenFu={};
      c.followups=fus.map(function(f){
        if(!f||typeof f!=="object") throw new Error("bad-followup");
        var fid=safeId(f.id)?f.id:uid(); if(seenFu[fid]) fid=uid(); seenFu[fid]=1;
        var created=migrateDateStr(f.date)||todayStr(), due=migrateDateStr(f.dueDate||"");
        return {id:fid,title:safeString(f.title,3000),priority:f.priority==="urgent"?"urgent":"normal",description:safeString(f.description,20000),done:!!f.done,date:created,dueDate:due,createdAt:safeString(f.createdAt,40)||new Date().toISOString(),updatedAt:safeString(f.updatedAt,40)||new Date().toISOString()};
      });
      var fins=Array.isArray(src.finance)?src.finance:[]; if(fins.length>20000) throw new Error("too-many-finance");
      var seenFin={};
      c.finance=fins.map(function(x){
        if(!x||typeof x!=="object") return null;
        var xid=safeId(x.id)?x.id:uid(); if(seenFin[xid]) xid=uid(); seenFin[xid]=1;
        var kind=x.kind==="income"?"income":"expense";
        var cat=safeEnum(x.category,FIN_CATS,finFallbackCat(kind));
        if(FIN_CATS[cat].kind!==kind) cat=finFallbackCat(kind);
        var amt=Number(toLatinDigits(String(x.amount)).replace(/[,،٬\s]/g,""));
        if(!isFinite(amt)||amt<=0) return null;
        amt=Math.min(Math.round(amt),1e15);
        return { id:xid, kind:kind, category:cat, amount:amt,
          date:migrateDateStr(x.date)||todayStr(),
          payer:safeEnum(x.payer,FIN_PAYERS,finDefaultPayer(kind)),
          account:safeString(x.account,2000), refNo:safeString(x.refNo,500),
          description:safeString(x.description,20000),
          createdAt:safeString(x.createdAt,40)||new Date().toISOString(),
          updatedAt:safeString(x.updatedAt,40)||new Date().toISOString() };
      }).filter(Boolean);
      return c;
    });
    var profile=null;
    if(parsed.profile&&typeof parsed.profile==="object") profile={firstName:safeString(parsed.profile.firstName,500),lastName:safeString(parsed.profile.lastName,500),displayTitle:safeString(parsed.profile.displayTitle,1000),subtitle:safeString(parsed.profile.subtitle,1000),role:safeString(parsed.profile.role,1000)};
    var attachments=[];
    if(Array.isArray(parsed.attachments)){
      if(parsed.attachments.length>50000) throw new Error("too-many-attachments");
      var caseIds={}; cases.forEach(function(c){caseIds[c.id]=1;});
      parsed.attachments.forEach(function(a){
        if(!a||typeof a!=="object"||!safeId(a.id)||!safeId(a.caseId)||!caseIds[a.caseId]) throw new Error("bad-attachment");
        if(typeof a.dataURL!=="string" || a.dataURL.indexOf("data:")!==0) throw new Error("bad-attachment-data");
        attachments.push({id:a.id,caseId:a.caseId,title:safeString(a.title,3000),fileName:safeString(a.fileName,1000),mimeType:safeString(a.mimeType,300),size:Number(a.size)||0,date:migrateDateStr(a.date)||todayStr(),dataURL:a.dataURL});
      });
    }
    return {version:Number(parsed.version)||1,profile:profile,cases:cases,attachments:attachments,appearance:parsed.appearance||null};
  }
  function loadState(cb){

  /* ---------------- data ops ---------------- */
  function getCase(id){
    for(var i=0;i<state.cases.length;i++) if(state.cases[i].id===id) return state.cases[i];
    return null;
  }
  function upsertCase(data,id){
    var nowIso=new Date().toISOString();
    if(id){
      var c=getCase(id);
      if(c){ Object.keys(data).forEach(function(k){ c[k]=data[k]; }); c.updatedAt=nowIso; }
    } else {
      data.id=uid(); data.events=[]; data.followups=[]; data.finance=[]; data.createdAt=nowIso; data.updatedAt=nowIso; state.cases.unshift(data);
    }
    saveState();
  }
  function deleteCase(id){
    state.cases=state.cases.filter(function(c){return c.id!==id;});
    if(state.selectedCaseId===id) state.selectedCaseId=null;
    delete state.attachmentsByCase[id];
    if(attachmentsOK) deleteAttachmentsForCase(id);
    saveState();
  }
  function loadAttachmentsFor(caseId){
    if(!attachmentsOK) return;
    var cur=state.attachmentsByCase[caseId];
    if(cur==="loading"||Array.isArray(cur)) return;
    state.attachmentsByCase[caseId]="loading";
    getAttachmentsForCase(caseId).then(function(list){
      list.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
      state.attachmentsByCase[caseId]=list;
      render();
    }).catch(function(){
      attachmentsOK=false;
      state.attachmentsByCase[caseId]=[];
      render();
    });
  }
  function upsertEvent(caseId,data,eventId){
    var c=getCase(caseId); if(!c) return;
    if(eventId){
      c.events.forEach(function(e){ if(e.id===eventId){ e.type=data.type; e.date=data.date; e.title=data.title; e.description=data.description; e.updatedAt=new Date().toISOString(); } });
    } else {
      c.events.push({id:uid(),type:data.type,date:data.date,title:data.title,description:data.description,done:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    }
    saveState();
  }
  function deleteEvent(caseId,eventId){
    var c=getCase(caseId); if(!c) return;
    c.events=c.events.filter(function(e){return e.id!==eventId;});
    saveState();
  }
  function toggleEventDone(caseId,eventId){
    var c=getCase(caseId); if(!c) return;
    c.events.forEach(function(e){ if(e.id===eventId) e.done=!e.done; });

  function upsertFollowup(caseId,data,followupId){
    var c=getCase(caseId); if(!c) return;
    if(followupId){
      c.followups.forEach(function(f){ if(f.id===followupId){ f.title=data.title; f.priority=data.priority; f.description=data.description; f.dueDate=data.dueDate||""; f.updatedAt=new Date().toISOString(); } });
    } else {
      c.followups.unshift({id:uid(),title:data.title,priority:data.priority,description:data.description,done:false,date:todayStr(),dueDate:data.dueDate||"",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    }

  }
  function deleteFollowup(caseId,followupId){
    var c=getCase(caseId); if(!c) return;
    c.followups=c.followups.filter(function(f){return f.id!==followupId;});

  function toggleFollowupDone(caseId,followupId){
    var c=getCase(caseId); if(!c) return;
    c.followups.forEach(function(f){ if(f.id===followupId) f.done=!f.done; });

  function upsertFin(caseId,data,finId){
    var c=getCase(caseId); if(!c) return;
    if(!Array.isArray(c.finance)) c.finance=[];
    var nowIso=new Date().toISOString();
    if(finId){
      c.finance.forEach(function(x){ if(x.id===finId){
        x.kind=data.kind; x.category=data.category; x.amount=data.amount; x.date=data.date;
        x.payer=data.payer; x.account=data.account; x.refNo=data.refNo; x.description=data.description;
        x.updatedAt=nowIso;
      }});
    } else {
      c.finance.unshift({ id:uid(), kind:data.kind, category:data.category, amount:data.amount, date:data.date,
        payer:data.payer, account:data.account, refNo:data.refNo, description:data.description,
        createdAt:nowIso, updatedAt:nowIso });
    }
    c.updatedAt=nowIso;
    saveState();
  }
  function deleteFin(caseId,finId){
    var c=getCase(caseId); if(!c||!Array.isArray(c.finance)) return;
    c.finance=c.finance.filter(function(x){return x.id!==finId;});
    saveState();
  }
  // جمع‌های مالی یک پرونده — هر بار ثبت/ویرایش، از روی خود تراکنش‌ها دوباره محاسبه می‌شود
  function caseFinTotals(c){
    var t={income:0,expense:0,lawyerPaid:0,reimbursed:0};
    (c.finance||[]).forEach(function(x){
      if(x.kind==="income"){ t.income+=x.amount; if(x.category==="reimburse") t.reimbursed+=x.amount; }
      else { t.expense+=x.amount; if(x.payer==="lawyer") t.lawyerPaid+=x.amount; }
    });
    t.net=t.income-t.expense;
    t.clientDue=t.lawyerPaid-t.reimbursed;
    return t;
  }
  function pendingFollowups(){
    var list=[];
    state.cases.forEach(function(c){
      if(c.status==="closed") return;
      c.followups.forEach(function(f){
        if(!f.done) list.push({caseId:c.id, caseObj:c, item:f});
      });
    });
    list.sort(function(a,b){
      if(a.item.priority!==b.item.priority) return a.item.priority==="urgent"?-1:1;
      return String(a.item.dueDate||"9999/99/99").localeCompare(String(b.item.dueDate||"9999/99/99")) || String(a.item.date).localeCompare(String(b.item.date));
    });
    return list;
  }
  function pendingFollowupCounts(){
    var p=pendingFollowups();
    var urgent=p.filter(function(x){return x.item.priority==="urgent";}).length;
    return { total:p.length, urgent:urgent, normal:p.length-urgent };
  }

  function trackedItems(){
    var up=[], over=[];
    state.cases.forEach(function(c){
      if(c.status==="closed") return;
      c.events.forEach(function(e){
        if(!isTracked(e.type) || e.done) return;
        var d=daysDiff(e.date);
        if(d===null) return;
        var row={caseId:c.id, caseObj:c, event:e, diff:d};
        if(d<0) over.push(row); else up.push(row);
      });
    });
    up.sort(function(a,b){return a.diff-b.diff;});
    over.sort(function(a,b){return b.diff-a.diff;});
    return {upcoming:up, overdue:over};
  }
  function nextTrackedDiff(c){
    var best=null;
    c.events.forEach(function(e){
      if(!isTracked(e.type)||e.done) return;
      var d=daysDiff(e.date);
      if(d!==null && (best===null || d<best)) best=d;
    });
    return best;
  }
  function recentActivity(limit){
    var list=[];
    state.cases.forEach(function(c){
      c.events.forEach(function(e){ list.push({caseObj:c, caseId:c.id, event:e}); });
    });
    list.sort(function(a,b){ return String(b.event.createdAt||b.event.date).localeCompare(String(a.event.createdAt||a.event.date)); });
    return list.slice(0,limit||8);
  }

  function modalSignature(){
    var m=state.modal;
    if(!m) return "";
    return [m.type,m.id||"",m.caseId||"",m.eventId||"",m.followupId||"",m.finId||""].join("|");
  }
  function afterRenderFocus(){
    var modal=root.querySelector(".modal");
    if(!modal){ lastModalSig=""; return; }
    bindModalFocusTrap(modal);
    if(state.modal && state.modal._focus){
      var named=modal.querySelector('[name="'+state.modal._focus+'"]');
      if(named) try{ named.focus(); }catch(e){}
      state.modal._focus=null;
      lastModalSig=modalSignature();
      return;
    }
    if(state.modal && state.modal.errors){
      var errEl=modal.querySelector(".err");
      var field=errEl && errEl.parentNode && errEl.parentNode.querySelector("input,select,textarea");
      if(field){ try{ field.focus(); }catch(e){} }
      lastModalSig=modalSignature();
      return;
    }
    var sig=modalSignature();
    if(sig && sig!==lastModalSig){
      var first=modal.querySelector("input,select,textarea,button");
      if(first) try{ first.focus(); }catch(e){}
    }
    lastModalSig=sig;
  }
  function bindModalFocusTrap(modal){
    var nodes=modal.querySelectorAll("button,input,select,textarea,a[href]");
    if(!nodes.length) return;
    var first=nodes[0], last=nodes[nodes.length-1];
    modal.addEventListener("keydown",function(ev){
      if(ev.key!=="Tab") return;
      if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); last.focus(); }
      else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); first.focus(); }
    });
  }

  function renderStatsTab(){
    var period=state.statsPeriod||"month", st=collectStats(period);
    var metrics=[
      {k:"cases",label:"پرونده‌های جدید",cls:"",acc:"acc-brass",note:"بر اساس تاریخ ثبت/ورود پرونده"},
      {k:"followups",label:"پیگیری‌ها",cls:"followups",acc:"acc-slate",note:"پیگیری‌های ایجادشده"},
      {k:"motions",label:"لوایح ارسالی",cls:"motions",acc:"acc-violet",note:"رویدادهای «لایحه / دادخواست»"},
      {k:"wins",label:"برد",cls:"wins",acc:"acc-sage",note:"نتیجه پرونده = برد"},
      {k:"losses",label:"باخت",cls:"losses",acc:"acc-maroon",note:"نتیجه پرونده = باخت"}
    ];
    var max=1; metrics.forEach(function(m){if(st[m.k]>max) max=st[m.k];});
    var html='<div class="stats-head"><div><div class="stats-title">'+ico("chart")+' آمار عملکرد</div><div class="stats-sub">نمای آماری '+statsPeriodLabel(period)+'</div></div>'+

        '<button class="period-btn'+(period==="week"?' active':'')+'" data-act="stats-period" data-period="week">هفتگی</button>'+
        '<button class="period-btn'+(period==="month"?' active':'')+'" data-act="stats-period" data-period="month">ماهانه</button>'+
        '<button class="period-btn'+(period==="year"?' active':'')+'" data-act="stats-period" data-period="year">سالانه</button>'+
      '</div></div>';
    html+='<div class="stat-row">';
    metrics.forEach(function(m){
      html+='<div class="stat-card metric-card '+m.acc+'"><div class="num">'+toFaDigits(st[m.k])+'</div><div class="lbl">'+m.label+'</div><div class="metric-note">'+m.note+'</div></div>';
    });
    html+='</div>';
    html+='<div class="stats-panels">';
    html+='<div class="chart-card"><h3>مقایسه شاخص‌ها</h3><div class="chart-desc">تعداد هر شاخص در '+statsPeriodLabel(period)+'</div><div class="metric-bars">';
    metrics.forEach(function(m){
      var pct=Math.round((st[m.k]/max)*100);
      html+='<div class="metric-bar-row"><div class="metric-bar-label">'+m.label+'</div><div class="metric-track"><div class="metric-fill '+m.cls+'" style="width:'+pct+'%"></div></div><div class="metric-bar-num">'+toFaDigits(st[m.k])+'</div></div>';
    });
    html+='</div></div>';
    var bmax=1; st.buckets.forEach(function(b){if(b.value>bmax)bmax=b.value;});
    html+='<div class="chart-card"><h3>روند کل فعالیت‌ها</h3><div class="chart-desc">مجموع پرونده جدید، پیگیری، لایحه و نتیجه‌های ثبت‌شده در طول بازه</div><div class="trend-chart">';
    st.buckets.forEach(function(b){
      var h=b.value?Math.max(2,Math.round((b.value/bmax)*128)):0;
      html+='<div class="trend-col" title="'+escapeHtml(b.label)+': '+b.value+'"><div class="trend-value">'+(b.value?toFaDigits(b.value):'')+'</div><div class="trend-bar-wrap"><div class="trend-bar" style="height:'+h+'px"></div></div><div class="trend-label">'+escapeHtml(b.label)+'</div></div>';
    });
    html+='</div>';
    if(st.cases+st.followups+st.motions+st.wins+st.losses===0) html+='<div class="stats-empty-note">در این بازه هنوز داده‌ای ثبت نشده است.</div>';

    html+='<div class="stat-row">'+
      '<div class="stat-card metric-card acc-sage"><div class="num money pos">'+formatMoney(fin.income)+'</div><div class="lbl">دریافتی‌ها (درآمد)</div><div class="metric-note">جمع تراکنش‌های «دریافتی» ثبت‌شده در بازه</div></div>'+
      '<div class="stat-card metric-card acc-maroon"><div class="num money neg">'+formatMoney(fin.expense)+'</div><div class="lbl">هزینه‌های پرداختی</div><div class="metric-note">جمع تراکنش‌های «هزینه» ثبت‌شده در بازه</div></div>'+
      '<div class="stat-card metric-card acc-amber"><div class="num money" style="color:var(--amber);">'+formatMoney(fin.lawyerPaid)+'</div><div class="lbl">پرداختیِ شخص وکیل</div><div class="metric-note">هزینه‌هایی که پرداخت‌کنندهٔ آن «وکیل» ثبت شده است</div></div>'+
      '<div class="stat-card metric-card acc-teal'+(fin.net<0?" alarm":"")+'"><div class="num money'+(fin.net>0?" pos":(fin.net<0?" neg":""))+'">'+formatMoney(fin.net)+'</div><div class="lbl">تراز (دریافتی − هزینه)</div><div class="metric-note">ماندهٔ خالص همین بازه</div></div>'+
    '</div>';
    var fmax=1; fin.buckets.forEach(function(b){ if(b.inc>fmax)fmax=b.inc; if(b.exp>fmax)fmax=b.exp; });
    html+='<div class="chart-card"><h3>روند مالی</h3><div class="chart-desc">مقایسهٔ دریافتی و هزینه در '+statsPeriodLabel(period)+' — برای دیدن مبلغ دقیق، نشانگر را روی ستون نگه دارید</div>';
    html+='<div class="fin-legend"><span><i class="inc"></i>دریافتی</span><span><i class="exp"></i>هزینه</span></div>';
    html+='<div class="trend-chart">';
    fin.buckets.forEach(function(b){
      var hi=b.inc?Math.max(2,Math.round((b.inc/fmax)*128)):0;
      var he=b.exp?Math.max(2,Math.round((b.exp/fmax)*128)):0;
      html+='<div class="trend-col" title="'+escapeHtml(b.label)+' — دریافتی: '+formatMoney(b.inc)+' | هزینه: '+formatMoney(b.exp)+'">'+
        '<div class="trend-value"></div>'+
        '<div class="trend-bar-wrap fin-pair">'+
          '<div class="trend-bar inc" style="height:'+hi+'px"></div>'+
          '<div class="trend-bar exp" style="height:'+he+'px"></div>'+
        '</div>'+
        '<div class="trend-label">'+escapeHtml(b.label)+'</div></div>';
    });
    html+='</div>';
    if(!fin.count) html+='<div class="stats-empty-note">در این بازه تراکنش مالی ثبت نشده است. از داخل هر پرونده، بخش «امور مالی و پرداختی‌ها» را تکمیل کنید.</div>';
    html+='</div>';
    return html;
  }

  function renderCases(){
    var q=toLatinDigits(state.searchQuery||"").trim().toLowerCase();
    var filtered=state.cases.filter(function(c){
      if(state.filterCourt && c.courtType!==state.filterCourt) return false;
      if(state.filterStatus && c.status!==state.filterStatus) return false;
      if(!q) return true;
      var hay=toLatinDigits([c.caseNumber,c.fileNumber,c.branch,c.client,c.plaintiff,c.defendant,c.subject,c.nextAction].join(" ")).toLowerCase();
      return hay.indexOf(q)!==-1;
    });
    filtered.sort(function(a,b){
      var da=nextTrackedDiff(a), db=nextTrackedDiff(b);
      if(da===null&&db===null) return 0;
      if(da===null) return 1;
      if(db===null) return -1;
      return da-db;
    });

    var courtOpts='<option value="">همهٔ مراجع</option>';
    Object.keys(COURTS).forEach(function(k){
      courtOpts+='<option value="'+k+'"'+(state.filterCourt===k?" selected":"")+'>'+COURTS[k].label+'</option>';
    });
    var statusOpts='<option value="">همهٔ وضعیت‌ها</option>';
    Object.keys(STATUS_META).forEach(function(k){
      statusOpts+='<option value="'+k+'"'+(state.filterStatus===k?" selected":"")+'>'+STATUS_META[k].label+'</option>';
    });

    var html='<div class="filter-bar no-print">'+
      '<input type="text" placeholder="جستجو در شماره پرونده، بایگانی، موکل، طرفین، موضوع…" data-act="search" value="'+escapeHtml(state.searchQuery||"")+'">'+
      '<select data-act="filter-court">'+courtOpts+'</select>'+
      '<select data-act="filter-status">'+statusOpts+'</select>'+
    '</div>';

    html+='<div class="cases-layout">';
    html+='<div class="case-list '+(state.selectedCaseId?"col-hidden":"")+'">';
    if(!filtered.length){
      html+='<div class="empty">'+(state.cases.length===0?"هنوز پرونده‌ای ثبت نشده است.":"پرونده‌ای با این فیلترها یافت نشد.")+'</div>';
    } else {
      filtered.forEach(function(c){
        var sm=STATUS_META[c.status]||STATUS_META.active;
        var ct=court(c.courtType);
        var nd=nextTrackedDiff(c);
        html+='<button class="case-card '+(state.selectedCaseId===c.id?"selected":"")+(c.status!=="active"?" dim":"")+'" '+
          'style="border-inline-end-color:'+ct.color+'" data-act="open-case" data-id="'+c.id+'">'+
          '<div class="cnum">'+escapeHtml(c.caseNumber||"بدون شماره")+
            (c.fileNumber?' <span class="cfiling">| بایگانی '+escapeHtml(c.fileNumber)+'</span>':'')+'</div>'+
          '<div class="cparties">'+escapeHtml([c.plaintiff,c.defendant].filter(Boolean).join(" / ")||"طرفین ثبت نشده")+'</div>'+
          '<div class="csubject">'+escapeHtml(c.subject||"")+'</div>'+
          '<div class="cmeta">'+
            '<span class="badge '+ct.badge+'">'+ct.label+'</span>'+
            '<span class="badge '+sm.badge+'">'+sm.label+'</span>'+
            (c.branch?'<span class="badge badge-muted">'+escapeHtml(c.branch)+'</span>':'')+
            (nd!==null?'<span class="badge '+(nd<0?"badge-maroon":(nd<=3?"badge-maroon":"badge-slate"))+'">'+urgencyLabel(nd)+'</span>':'')+
          '</div>'+
        '</button>';
      });
    }
    html+='</div>';

  /* ---------------- events ---------------- */
  function bindEvents(){
    root.querySelectorAll("[data-act]").forEach(function(el){
      var act=el.getAttribute("data-act");
      if(act==="search"||act==="filter-court"||act==="filter-status"||act==="court-change"||act==="font-range"||act==="icon-range"||act==="font-range-panel"||act==="icon-range-panel") return;
      el.addEventListener("click",function(ev){
        if(act==="view"){ state.view=el.getAttribute("data-view"); state.selectedCaseId=null; state.appearanceOpen=false; render(); }
        else if(act==="stats-period"){ var sp=el.getAttribute("data-period"); state.statsPeriod=(sp==="week"||sp==="year")?sp:"month"; render(); }
        else if(act==="toggle-appearance"){ state.appearanceOpen=!state.appearanceOpen; render(); }
        else if(act==="close-appearance"){ state.appearanceOpen=false; render(); }
        else if(act==="set-font-scale"){ patchAppearance({fontScale:parseFloat(el.getAttribute("data-scale"))}); }
        else if(act==="set-icon-scale"){ patchAppearance({iconScale:parseFloat(el.getAttribute("data-scale"))}); }
        else if(act==="set-palette"){ patchAppearance({palette:el.getAttribute("data-palette")}); }
        else if(act==="font-down"){ bumpAppearance("fontScale",-1); }
        else if(act==="font-up"){ bumpAppearance("fontScale",1); }
        else if(act==="icon-down"){ bumpAppearance("iconScale",-1); }
        else if(act==="icon-up"){ bumpAppearance("iconScale",1); }
        else if(act==="new-case"){ state.modal={type:"case"}; render(); }
        else if(act==="edit-case"){ state.modal={type:"case",id:el.getAttribute("data-id")}; render(); }
        else if(act==="delete-case"){
          var cid=el.getAttribute("data-id");
          state.modal={type:"confirm",message:"پرونده و تمام رویدادهای آن حذف خواهد شد. ادامه می‌دهید؟",onConfirm:function(){ deleteCase(cid); state.view="cases"; }};
          render();
        }
        else if(act==="open-case"){ state.selectedCaseId=el.getAttribute("data-id"); state.view="cases"; loadAttachmentsFor(state.selectedCaseId); render(); window.scrollTo(0,0); }
        else if(act==="close-detail"){ state.selectedCaseId=null; render(); }
        else if(act==="print-case"){ window.print(); }
        else if(act==="new-event"){ state.modal={type:"event",caseId:el.getAttribute("data-id")}; render(); }
        else if(act==="edit-event"){ state.modal={type:"event",caseId:el.getAttribute("data-case"),eventId:el.getAttribute("data-id")}; render(); }
        else if(act==="toggle-done"){ toggleEventDone(el.getAttribute("data-case"),el.getAttribute("data-id")); render(); }
        else if(act==="delete-event"){
          var kc=el.getAttribute("data-case"), ke=el.getAttribute("data-id");
          state.modal={type:"confirm",message:"این رویداد حذف شود؟",onConfirm:function(){ deleteEvent(kc,ke); }};
          render();
        }
        else if(act==="new-attachment"){ state.modal={type:"attachment",caseId:el.getAttribute("data-id")}; render(); }
        else if(act==="download-attachment"){
          var dcId=el.getAttribute("data-case"), daId=el.getAttribute("data-id");
          var arr=state.attachmentsByCase[dcId];
          var rec=Array.isArray(arr)?arr.filter(function(x){return x.id===daId;})[0]:null;
          if(rec&&rec.data){
            try{
              var url=URL.createObjectURL(rec.data);
              var link=document.createElement("a");
              link.href=url; link.download=rec.fileName||"attachment";
              document.body.appendChild(link); link.click(); document.body.removeChild(link);
              setTimeout(function(){ URL.revokeObjectURL(url); },1000);
            }catch(e){ showToast("دانلود پیوست ممکن نشد."); }
          }
        }
        else if(act==="delete-attachment"){
          var xcId=el.getAttribute("data-case"), xaId=el.getAttribute("data-id");
          state.modal={type:"confirm",message:"این پیوست حذف شود؟ این کار قابل بازگشت نیست.",onConfirm:function(){
            deleteAttachment(xaId).then(function(){
              var arr=state.attachmentsByCase[xcId];
              if(Array.isArray(arr)) state.attachmentsByCase[xcId]=arr.filter(function(x){return x.id!==xaId;});
              render();
            }).catch(function(){ showToast("حذف پیوست ممکن نشد."); });
          }};
          render();
        }
        else if(act==="new-followup"){ state.modal={type:"followup",caseId:el.getAttribute("data-id")}; render(); }
        else if(act==="edit-followup"){ state.modal={type:"followup",caseId:el.getAttribute("data-case"),followupId:el.getAttribute("data-id")}; render(); }
        else if(act==="toggle-followup-done"){ toggleFollowupDone(el.getAttribute("data-case"),el.getAttribute("data-id")); render(); }
        else if(act==="delete-followup"){
          var fcId=el.getAttribute("data-case"), ffId=el.getAttribute("data-id");
          state.modal={type:"confirm",message:"این پیگیری حذف شود؟",onConfirm:function(){ deleteFollowup(fcId,ffId); }};
          render();
        }
        else if(act==="new-fin"){ state.modal={type:"fin",caseId:el.getAttribute("data-id"),kindDefault:el.getAttribute("data-kind")==="income"?"income":"expense"}; render(); }
        else if(act==="edit-fin"){ state.modal={type:"fin",caseId:el.getAttribute("data-case"),finId:el.getAttribute("data-id")}; render(); }
        else if(act==="delete-fin"){
          var qcId=el.getAttribute("data-case"), qfId=el.getAttribute("data-id");
          state.modal={type:"confirm",message:"این تراکنش مالی حذف شود؟ جمع‌های پرونده و آمار بلافاصله به‌روز می‌شود.",onConfirm:function(){ deleteFin(qcId,qfId); }};
          render();
        }
        else if(act==="help"){ ev.preventDefault(); ev.stopPropagation(); toggleHelp(el, el.getAttribute("data-help")); }
        else if(act==="snooze-backup"){ var mm=loadMeta(); mm.backupSnoozeUntil=Date.now()+7*86400000; saveMeta(mm); render(); }
        else if(act==="close-modal"){ state.modal=null; render(); }
        else if(act==="confirm-yes"){ if(state.modal&&state.modal.onConfirm) state.modal.onConfirm(); state.modal=null; render(); }
        else if(act==="confirm-import"){
          if(state.modal&&state.modal.data){
            var imp=state.modal.data, oldAtts=[];
            getAllAttachments().then(function(list){
              oldAtts=list;
              // پیش از حذف چیزی، همه داده‌های پیوست ورودی را decode می‌کنیم تا فایل خراب زودتر رد شود.
              var staged=(imp.attachments||[]).map(function(a){
                var blob=dataURLToBlob(a.dataURL);
                return {id:a.id,caseId:a.caseId,title:a.title,fileName:a.fileName,mimeType:a.mimeType||blob.type,size:a.size||blob.size,date:a.date,data:blob};
              });
              return clearAllAttachments().then(function(){ return Promise.all(staged.map(addAttachment)); });
            }).then(function(){
              state.cases=imp.cases; if(imp.profile) state.profile=imp.profile;
              if(imp.appearance&&typeof imp.appearance==="object") state.appearance=Object.assign(defaultAppearance(),imp.appearance);
              state.attachmentsByCase={}; state.loadError=false; state.rawRecovery=null; saveState(); saveAppearance(); applyAppearance();
              markBackupDone();
              state.modal=null; state.selectedCaseId=null; render(); showToast("پشتیبان با موفقیت بازیابی شد.");
            }).catch(function(){
              // rollback پیوست‌ها در صورت شکست میانهٔ بازیابی
              clearAllAttachments().then(function(){ return Promise.all(oldAtts.map(addAttachment)); }).catch(function(){});
              showToast("بازیابی انجام نشد و داده‌های قبلی حفظ شدند.");
            });
          }
        }
        else if(act==="export"){ exportBackup(); }
        else if(act==="export-raw"){ if(state.rawRecovery){ triggerDownload(new Blob([state.rawRecovery],{type:"application/json"}),"cases-raw-recovery-"+todayStr().replace(/\//g,"-")+".json"); } }
        else if(act==="download-app"){ downloadAppFile(); }
        else if(act==="edit-profile"){ state.modal={type:"profile"}; render(); }
        else if(act==="import-trigger"){ var fi=root.querySelector("#importFile"); if(fi) fi.click(); }
        else if(act==="preset"){
          var dd=root.querySelector("#calcDays"); if(dd) dd.value=el.getAttribute("data-days");
        }
        else if(act==="calc-run"){
          var out=root.querySelector("#calcResult");
          function say(msg,bad){ if(out){ out.textContent=msg; out.style.color=bad?"var(--alarm)":"var(--brass)"; } }
          var from=normalizeJalaliInput((root.querySelector("#calcFrom")||{}).value);
          var days=parseInt(toLatinDigits((root.querySelector("#calcDays")||{}).value),10);
          if(!from){ say("تاریخ مبدأ معتبر نیست.",true); return; }
          if(!days||days<1){ say("تعداد روز معتبر نیست.",true); return; }
          var res=addDaysToJalali(from,days);
          var de=root.querySelector("#eventDate");
          if(de&&res){
            de.value=toFaDigits(res);
            say("سررسید: "+toFaDigits(res)+" — در کادر تاریخ درج شد.",false);
          }
        }
        else if(act==="backdrop"){ if(ev.target===el){ state.modal=null; render(); } }
      });
    });

    function bindScaleRange(acts, key){
      acts.forEach(function(actName){
        root.querySelectorAll('[data-act="'+actName+'"]').forEach(function(el){
          el.addEventListener("input",function(){
            var patch={}; patch[key]=parseFloat(el.value);
            liveAppearance(patch);
            acts.forEach(function(a){
              root.querySelectorAll('[data-act="'+a+'"]').forEach(function(other){
                if(other!==el) other.value=el.value;
              });
            });
          });
        });
      });
    }
    bindScaleRange(["font-range","font-range-panel"],"fontScale");
    bindScaleRange(["icon-range","icon-range-panel"],"iconScale");

    var search=root.querySelector('[data-act="search"]');
    if(search){
      search.addEventListener("input",function(){
        state.searchQuery=search.value;
        if(searchTimer) clearTimeout(searchTimer);
        searchTimer=setTimeout(function(){
          var active=document.activeElement;
          var pos=active&&active.getAttribute&&active.getAttribute("data-act")==="search"?active.selectionStart:null;
          render();
          var s2=root.querySelector('[data-act="search"]');
          if(s2){ s2.focus(); if(pos!=null) try{ s2.setSelectionRange(pos,pos); }catch(e){} }
        },140);
      });
    }
    var fc=root.querySelector('[data-act="filter-court"]');
    if(fc) fc.addEventListener("change",function(){ state.filterCourt=fc.value; render(); });
    var fs=root.querySelector('[data-act="filter-status"]');
    if(fs) fs.addEventListener("change",function(){ state.filterStatus=fs.value; render(); });

    var cc=root.querySelector('[data-act="court-change"]');
    if(cc){
      cc.addEventListener("change",function(){
        var form=root.querySelector('[data-form="case"]');
        var fd=new FormData(form);
        var vals={}; fd.forEach(function(val,k){ vals[k]=val; });
        state.modal.values=vals; state.modal._focus="courtType"; render();
      });
    }

    var importFile=root.querySelector("#importFile");
    if(importFile){
      importFile.addEventListener("change",function(){
        var file=importFile.files&&importFile.files[0];
        if(!file) return;
        if(file.size>MAX_IMPORT_BYTES){ showToast("حجم فایل پشتیبان بیش از حد مجاز است."); importFile.value=""; return; }
        var reader=new FileReader();
        reader.onload=function(){
          try{
            var data=normalizeImportedData(JSON.parse(reader.result));
            state.modal={type:"import-confirm",data:data}; render();
          }catch(e){ showToast("فایل انتخاب‌شده یک پشتیبان معتبر نیست."); }
          importFile.value="";
        };
        reader.onerror=function(){ showToast("خواندن فایل پشتیبان ممکن نشد."); importFile.value=""; };
        reader.readAsText(file);
      });
    }

    var attFile=root.querySelector("#attFile");
    if(attFile){
      var attTitleEl=root.querySelector("#attTitle");
      var titleTouched=!!(attTitleEl&&attTitleEl.value);
      if(attTitleEl) attTitleEl.addEventListener("input",function(){ titleTouched=true; });
      attFile.addEventListener("change",function(){
        var f=attFile.files&&attFile.files[0];
        var hint=root.querySelector("#attSizeHint");
        if(f&&hint){
          hint.textContent="حجم فایل: "+formatBytes(f.size)+(f.size>20*1024*1024?" — فایل حجیم است؛ ذخیره ممکن است طول بکشد.":"");
        }
        if(f&&attTitleEl&&!titleTouched){
          var base=f.name.replace(/\.[^.]+$/,"");
          attTitleEl.value=base;
        }
      });
    }

    var attachForm=root.querySelector('[data-form="attachment"]');
    if(attachForm){
      attachForm.addEventListener("submit",function(ev){
        ev.preventDefault();
        var fileEl=root.querySelector("#attFile");
        var file=fileEl&&fileEl.files&&fileEl.files[0];
        var titleEl=root.querySelector("#attTitle");
        var title=(titleEl&&titleEl.value||"").trim();
        var errors={};
        if(!file) errors.file="یک فایل انتخاب کنید.";
        if(!title) errors.title="عنوان الزامی است.";
        if(Object.keys(errors).length){
          state.modal.errors=errors; state.modal.titleValue=title; render(); return;
        }
        var submitBtn=root.querySelector("#attSubmitBtn");
        if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent="در حال ذخیره…"; }
        var caseId=state.modal.caseId;
        var rec={ id:uid(), caseId:caseId, title:title, fileName:file.name,
          mimeType:file.type||"application/octet-stream", size:file.size, date:todayStr(), data:file };
        addAttachment(rec).then(function(){
          var arr=state.attachmentsByCase[caseId];
          if(Array.isArray(arr)){ arr.unshift(rec); }
          state.modal=null; render();
        }).catch(function(){
          if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent="ذخیره پیوست"; }
          state.modal.errors={file:"ذخیرهٔ فایل ممکن نشد؛ ممکن است حجم فایل زیاد باشد یا فضای مرورگر کافی نباشد."};
          render();
        });
      });
    }

    var followupForm=root.querySelector('[data-form="followup"]');
    if(followupForm){
      followupForm.addEventListener("submit",function(ev){
        ev.preventDefault();
        var fd=new FormData(followupForm);
        var title=(fd.get("title")||"").trim();
        var dueRaw=(fd.get("dueDate")||"").trim(), due=dueRaw?normalizeJalaliInput(dueRaw):"";
        var data={ title:title, priority:fd.get("priority")==="urgent"?"urgent":"normal", dueDate:due||dueRaw, description:(fd.get("description")||"").trim() };
        var fuErr={}; if(!title) fuErr.title="عنوان الزامی است."; if(dueRaw&&!due) fuErr.dueDate="تاریخ سررسید معتبر نیست.";
        if(Object.keys(fuErr).length){ state.modal.errors=fuErr; state.modal.values=data; render(); return; }
        upsertFollowup(state.modal.caseId,data,state.modal.followupId);
        state.modal=null; render();
      });
    }

    var finKindSel=root.querySelector('[data-act="fin-kind-change"]');
    if(finKindSel){
      finKindSel.addEventListener("change",function(){
        var form=root.querySelector('[data-form="fin"]');
        var fd=new FormData(form);
        var vals={}; fd.forEach(function(val,k){ vals[k]=val; });
        if(!FIN_CATS[vals.category] || FIN_CATS[vals.category].kind!==vals.kind){
          vals.category=finDefaultCat(vals.kind);
          vals.payer=finDefaultPayer(vals.kind);
        }
        state.modal.values=vals; state.modal._focus="kind"; render();
      });
    }
    var finAmt=root.querySelector("#finAmount");
    if(finAmt){
      var finWordsEl=root.querySelector("#finWords");
      var updFinWords=function(){
        if(!finWordsEl) return;
        var n=parseAmount(finAmt.value);
        if(n) finWordsEl.textContent="به حروف: "+numToWordsFa(n)+" تومان";
        else finWordsEl.textContent=finAmt.value.trim()?"مبلغ نامعتبر است — فقط رقم وارد کنید.":"";
      };
      finAmt.addEventListener("input",updFinWords);
      finAmt.addEventListener("blur",function(){ var n=parseAmount(finAmt.value); if(n) finAmt.value=formatMoney(n); updFinWords(); });
      updFinWords();
    }
    var finForm=root.querySelector('[data-form="fin"]');
    if(finForm){
      finForm.addEventListener("submit",function(ev){
        ev.preventDefault();
        var fd=new FormData(finForm);
        var kind=fd.get("kind")==="income"?"income":"expense";
        var category=fd.get("category");
        if(!FIN_CATS[category] || FIN_CATS[category].kind!==kind) category=finFallbackCat(kind);
        var amount=parseAmount(fd.get("amount"));
        var date=normalizeJalaliInput(fd.get("date")||"");
        var payerRaw=fd.get("payer");
        var payer=Object.prototype.hasOwnProperty.call(FIN_PAYERS,payerRaw)?payerRaw:finDefaultPayer(kind);
        var data={ kind:kind, category:category, amount:amount||0, date:date||fd.get("date"), payer:payer,
          account:(fd.get("account")||"").trim(), refNo:(fd.get("refNo")||"").trim(), description:(fd.get("description")||"").trim() };
        var finErr={};
        if(!amount) finErr.amount="مبلغ معتبر نیست؛ فقط رقم (به تومان) وارد کنید.";
        if(!date) finErr.date="تاریخ معتبر نیست. نمونه: ۱۴۰۵/۰۶/۱۰";
        if(Object.keys(finErr).length){
          state.modal.errors=finErr;
          state.modal.values=Object.assign({},data,{amount:fd.get("amount")});
          render(); return;
        }
        upsertFin(state.modal.caseId,data,state.modal.finId);
        state.modal=null; render();
      });
    }

    var profileForm=root.querySelector('[data-form="profile"]');
    if(profileForm){
      // پیشنهاد خودکار عنوان سربرگ تا وقتی کاربر خودش آن را ننوشته باشد
      var tEl=root.querySelector("#pfTitle");
      var fEl=root.querySelector("#pfFirst");
      var lEl=root.querySelector("#pfLast");
      if(tEl&&fEl&&lEl){
        var touched=!!tEl.value;
        tEl.addEventListener("input",function(){ touched=true; });
        function suggest(){
          if(touched) return;
          var nm=[fEl.value.trim(),lEl.value.trim()].filter(Boolean).join(" ");
          tEl.value=nm?("دفتر وکالت "+nm):"";
        }
        fEl.addEventListener("input",suggest);
        lEl.addEventListener("input",suggest);
      }
      profileForm.addEventListener("submit",function(ev){
        ev.preventDefault();
        var fd=new FormData(profileForm);
        var p={
          firstName:(fd.get("firstName")||"").trim(),
          lastName:(fd.get("lastName")||"").trim(),
          displayTitle:(fd.get("displayTitle")||"").trim(),
          subtitle:(fd.get("subtitle")||"").trim(),
          role:(fd.get("role")||"").trim()
        };
        if(!p.firstName && !p.lastName){
          state.modal=state.modal||{type:"profile"};
          state.modal.errors={name:"نام یا نام خانوادگی را وارد کنید."};
          state.modal.values=p; render(); return;
        }
        if(!p.displayTitle) p.displayTitle="دفتر وکالت "+[p.firstName,p.lastName].filter(Boolean).join(" ");
        state.profile=p; saveState();
        state.modal=null; render();
      });
    }

    var caseForm=root.querySelector('[data-form="case"]');
    if(caseForm){
      caseForm.addEventListener("submit",function(ev){
        ev.preventDefault();
        var fd=new FormData(caseForm);
        var data={
          courtType:fd.get("courtType"),
          caseNumber:(fd.get("caseNumber")||"").trim(),
          fileNumber:(fd.get("fileNumber")||"").trim(),
          branch:(fd.get("branch")||"").trim(),
          status:fd.get("status"),
          openedDate:normalizeJalaliInput(fd.get("openedDate")||"")||"",
          outcome:fd.get("outcome")==="win"?"win":(fd.get("outcome")==="loss"?"loss":"pending"),
          outcomeDate:normalizeJalaliInput(fd.get("outcomeDate")||"")||"",
          client:(fd.get("client")||"").trim(),
          clientRole:(fd.get("clientRole")||"").trim(),
          plaintiff:(fd.get("plaintiff")||"").trim(),
          defendant:(fd.get("defendant")||"").trim(),
          subject:(fd.get("subject")||"").trim(),
          nextAction:(fd.get("nextAction")||"").trim()
        };
        var caseErrors={};
        if(!data.caseNumber && !data.fileNumber) caseErrors.caseNumber="دست‌کم شماره پرونده یا شماره بایگانی را وارد کنید.";
        if(!data.openedDate) caseErrors.openedDate="تاریخ ثبت پرونده معتبر نیست.";
        var rawOutcomeDate=(fd.get("outcomeDate")||"").trim();
        if(rawOutcomeDate && !data.outcomeDate) caseErrors.outcomeDate="تاریخ نتیجه معتبر نیست.";
        if(data.outcome!=="pending" && !data.outcomeDate) data.outcomeDate=todayStr();
        if(data.outcome==="pending") data.outcomeDate="";
        if(Object.keys(caseErrors).length){ state.modal.errors=caseErrors; state.modal.values=data; render(); return; }
        upsertCase(data,state.modal.id);
        state.modal=null; render();
      });
    }

    var eventForm=root.querySelector('[data-form="event"]');
    if(eventForm){
      eventForm.addEventListener("submit",function(ev){
        ev.preventDefault();
        var fd=new FormData(eventForm);
        var norm=normalizeJalaliInput(fd.get("date")||"");
        var title=(fd.get("title")||"").trim();
        var errors={};
        if(!norm) errors.date="تاریخ معتبر نیست. نمونه: ۱۴۰۵/۰۶/۱۰";
        if(!title) errors.title="عنوان الزامی است.";
        var data={type:fd.get("type"),date:norm||fd.get("date"),title:title,description:(fd.get("description")||"").trim()};
        if(Object.keys(errors).length){ state.modal.errors=errors; state.modal.values=data; render(); return; }
        upsertEvent(state.modal.caseId,data,state.modal.eventId);
        state.modal=null; render();
      });
    }
  }

  document.addEventListener("keydown",function(ev){
    if(ev.key!=="Escape" && ev.key!=="Esc") return;
    if(helpPopEl){ ev.preventDefault(); closeHelp(); return; }
    if(state.appearanceOpen){ ev.preventDefault(); state.appearanceOpen=false; render(); return; }
    if(!state.modal) return;
    ev.preventDefault();
    state.modal=null;
    render();
  });

  loadState(render);
})();
</script>
</body>
</html>
